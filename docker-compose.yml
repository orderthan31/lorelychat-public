services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/lorechat.db
      UPLOAD_ROOT: /uploads
      LOG_DIR: /logs
      PROVIDER_SECRET_ROOT: /secrets
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      LLM_MOCK: ${LLM_MOCK:-true}
      LORECHAT_SEED_DEMO: ${LORECHAT_SEED_DEMO:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-openai_compatible}
      CHAT_LLM_BASE_URL: ${CHAT_LLM_BASE_URL:-}
      CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-}
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-local}
      MEM0_ENABLED: ${MEM0_ENABLED:-false}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-}
    expose:
      - "8123"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lorechat_data:/data
      - lorechat_uploads:/uploads
      - lorechat_logs:/logs
      - lorechat_secrets:/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LORECHAT_BIND_ADDRESS:-127.0.0.1}:${LORECHAT_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  lorechat_data:
  lorechat_uploads:
  lorechat_logs:
  lorechat_secrets:
